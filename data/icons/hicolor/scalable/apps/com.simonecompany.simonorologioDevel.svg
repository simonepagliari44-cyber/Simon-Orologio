<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clockFaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e8b57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66cdaa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="128" cy="128" r="120" fill="url(#clockFaceGradient)" filter="url(#shadow)" stroke="#1a4d2e" stroke-width="3"/>

  <!-- Inner dial -->
  <circle cx="128" cy="128" r="105" fill="#f5f5f0"/>

  <!-- Hour markers -->
  <g stroke="#2e8b57" stroke-width="3" stroke-linecap="round">
    <line x1="128" y1="28" x2="128" y2="42"/>
    <line x1="128" y1="214" x2="128" y2="228"/>
    <line x1="28" y1="128" x2="42" y2="128"/>
    <line x1="214" y1="128" x2="228" y2="128"/>
    <line x1="52.8" y1="52.8" x2="65.5" y2="65.5"/>
    <line x1="190.5" y1="190.5" x2="203.2" y2="203.2"/>
    <line x1="52.8" y1="203.2" x2="65.5" y2="190.5"/>
    <line x1="190.5" y1="65.5" x2="203.2" y2="52.8"/>
  </g>

  <!-- Minute markers -->
  <g stroke="#66cdaa" stroke-width="1.5" stroke-linecap="round">
    <line x1="128" y1="32" x2="128" y2="38"/>
    <line x1="128" y1="218" x2="128" y2="224"/>
    <line x1="32" y1="128" x2="38" y2="128"/>
    <line x1="218" y1="128" x2="224" y2="128"/>
    <line x1="56.4" y1="56.4" x2="63.6" y2="63.6"/>
    <line x1="192.4" y1="192.4" x2="199.6" y2="199.6"/>
    <line x1="56.4" y1="199.6" x2="63.6" y2="192.4"/>
    <line x1="192.4" y1="63.6" x2="199.6" y2="56.4"/>
  </g>

  <!-- Hour hand (pointing at 10) -->
  <line x1="128" y1="128" x2="128" y2="55" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" transform="rotate(-60 128 128)"/>

  <!-- Minute hand (pointing at 12) -->
  <line x1="128" y1="128" x2="128" y2="40" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>

  <!-- Second hand (pointing at 20 sec) -->
  <line x1="128" y1="128" x2="128" y2="30" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" transform="rotate(120 128 128)"/>

  <!-- "S" letter in center -->
  <text x="128" y="140" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#2e8b57" text-anchor="middle" dominant-baseline="middle">S</text>

  <!-- Devel badge -->
  <text x="128" y="200" font-family="sans-serif" font-size="14" fill="#e74c3c" text-anchor="middle" font-weight="bold">Devel</text>
</svg>